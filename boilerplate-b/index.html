<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imie Nazwisko (00000) - IS LAB B</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>

<div class="todo-app">
    <h2>Lista zadań</h2>

    <div class="search-box">
        <input type="text" placeholder="Wyszukaj zadanie..." />
        <button type="button">Szukaj</button>
    </div>

    <ul class="task-list">
        <li><label><input type="checkbox"> Zadanie 1</label></li>
        <li><label><input type="checkbox"> Zadanie 2</label></li>
        <li><label><input type="checkbox"> Zadanie 3</label></li>
        <li><label><input type="checkbox"> Zadanie 4</label></li>
        <li><label><input type="checkbox"> Zadanie 5</label></li>
    </ul>

    <form class="add-task">
        <input type="text" placeholder="Nowe zadanie" />
        <input type="datetime-local" />
        <button type="submit">Dodaj zadanie</button>
    </form>
</div>
</body>
</html>
